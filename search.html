<h1>搜索</h1><p class="muted">输入关键词搜索本站产品与文章。</p><div class="search-box"><input type="search" id="q" placeholder="搜索产品与文章…" autocomplete="off"><button type="button" id="qbtn" class="btn">搜索</button></div><ul id="results" class="article-list"></ul><p id="nores" class="muted" style="display:none">无结果。</p><script>(function(){var idx=[];fetch("search-index.json").then(function(r){return r.json()}).then(function(d){idx=d||[]}).catch(function(){});function run(){var q=(document.getElementById("q").value||"").toLowerCase().trim();var ul=document.getElementById("results");var nr=document.getElementById("nores");ul.innerHTML="";if(!q){nr.style.display="none";return;}var hits=idx.filter(function(it){return (it.t+" "+it.b).toLowerCase().indexOf(q)>=0});nr.style.display=hits.length?"none":"block";hits.slice(0,50).forEach(function(it){var li=document.createElement("li");li.className="card";li.innerHTML="<a href=\""+it.u+"\"><strong>"+it.t+"</strong></a><div class=\"muted\">"+it.k+"</div>";ul.appendChild(li);});}document.getElementById("qbtn").onclick=run;document.getElementById("q").onkeydown=function(e){if(e.key==="Enter")run()};})();</script>
